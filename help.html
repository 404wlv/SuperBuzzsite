<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Help | SuperBuzz</title>
    <link rel="icon" href="https://404wlv.github.io/SuperBuzzsite/stuff/404icon.jpeg">

    </head>
    <body class="bg-[#123458] text-[#F1EFEC]">
        <form>
            <h1>Your Name</h1>
            <input type="text" id="help-name" name="name" placeholder="Enter your name" required>
            <h1>Your Email</h1>
            <input type="email" id="help-email" name="email" placeholder="Enter your email" required>
            <h1>Your Message</h1>
            <textarea id="help-message" name="message" placeholder="Enter your message" required></textarea>
            <button id="help-submit" type="submit">Submit</button>
        </form>
    </body>


</html>
