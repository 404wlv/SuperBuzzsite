<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | SuperBuzz</title>
  <link rel="icon" href="https://404wlv.github.io/SuperBuzzsite/stuff/404icon.jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#123458] text-[#F1EFEC] flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-[#E1D9BC] text-[#30364F] rounded-2xl shadow-2xl border border-[#334155] p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold">Reset Password</h1>
      <p class="text-sm text-gray-600 mt-2">
        Enter your new password below.
      </p>
    </div>

    <div id="status-message" class="hidden mb-4 text-sm rounded-xl p-3"></div>

    <form id="reset-password-form" class="space-y-4">
      <div>
        <label for="new-password" class="block mb-2 text-sm font-medium">New Password</label>
        <input
          id="new-password"
          type="password"
          placeholder="Enter new password"
          class="w-full p-3 rounded-xl border border-[#334155] bg-[#F0F0DB] text-[#30364F] focus:outline-none focus:ring-2 focus:ring-[#ACBAC4]"
          required
        />
      </div>
    </form>

   <form action="/transfer" method="POST" class="mt-4">
     <input type="hidden" name="amount">
     <input type="hidden" name="to_account">
     
     <button
    type="submit"
    class="p-3 rounded-xl bg-[#30364F] text-white"
  >
       Send
     </button>
   </form>

      <div>
        <label for="confirm-password" class="block mb-2 text-sm font-medium">Confirm Password</label>
        <input
          id="confirm-password"
          type="password"
          placeholder="Re-enter new password"
          class="w-full p-3 rounded-xl border border-[#334155] bg-[#F0F0DB] text-[#30364F] focus:outline-none focus:ring-2 focus:ring-[#ACBAC4]"
          required
        />
      </div>

      <button
        id="reset-password-btn"
        type="submit"
        class="w-full bg-[#30364F] text-[#F0F0DB] py-3 rounded-2xl hover:scale-[1.02] transition shadow-xl border border-[#334155]"
      >
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-[#30364F] font-semibold hover:underline">
        Back to sign in
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";
    import { updatePassword } from "./js/auth.js";

    const form = document.getElementById("reset-password-form");
    const newPasswordInput = document.getElementById("new-password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const statusMessage = document.getElementById("status-message");

    function showMessage(message, type = "info") {
      statusMessage.textContent = message;
      statusMessage.classList.remove(
        "hidden",
        "bg-red-100", "text-red-700",
        "bg-green-100", "text-green-700",
        "bg-yellow-100", "text-yellow-700"
      );

      if (type === "error") {
        statusMessage.classList.add("bg-red-100", "text-red-700");
      } else if (type === "success") {
        statusMessage.classList.add("bg-green-100", "text-green-700");
      } else {
        statusMessage.classList.add("bg-yellow-100", "text-yellow-700");
      }
    }

    async function checkRecoverySession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.log("Recovery session error:", error);
      }

      if (!data.session) {
        showMessage("Please open this page from the password reset link sent to your email.", "info");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (!newPassword || !confirmPassword) {
        showMessage("Please fill in both password fields.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      const success = await updatePassword(newPassword);

      if (success) {
        showMessage("Password updated successfully. Redirecting to sign in...", "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000);
      } else {
        showMessage("Could not update password. Please try again.", "error");
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
